    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const processProjects = [
          {
            key: "in-the-name-of-the-mother",
            title: "In the Name of the Mother",
            overview:
              "In the Name of the Mother is a hypothetical fantasy-adventure book aimed at a young audience. The themes of this story are honor and loyalty, which I tried to reflect in my design.",
            genre: "Fantasy/Adventure",
            audience: "Middle Grade/YA",
            tools: "Procreate",
            sections: [
              {
                title: "Planning",
                text: "Throughout the thumbnailing process, I played with scale, posing, and title placement. In the end, I chose the top right thumbnail because I felt it best represents the story's themes of honor and loyalty. The knight's pose suggests power and pride, but their head is pointed towards the titular 'mother', who is meant to be the metaphorical guiding light leading our protagonist down a path of honor.",
                images: [
                  {
                    src: "assets/process/in-the-name-of-the-mother/Thumbnails.jpg",
                    alt: "Thumbnails",
                    caption: "Thumbnails",
                  },
                ],
              },
              {
                title: "Creating",
                text: "With the composition established I began brining the drawing to life.",
                images: [
                  {
                    src: "assets/process/in-the-name-of-the-mother/Sketch.jpg",
                    alt: "Early sketch",
                    caption: "Initial sketch",
                  },
                  {
                    src: "assets/process/in-the-name-of-the-mother/Values.jpg",
                    alt: "Black and white shading",
                    caption: "Establishing values",
                  },
                ],
              },
              {
                title: "Final Product",
                text: "Overall, I'm really proud of the composition and movement in this cover. I think it feels grand and hints at an adventurous story inside.",
                images: [
                  {
                    src: "assets/books/In-the-Name-of-the-Mother.jpg",
                    alt: "Final cover",
                    caption: "",
                  },
                ],
              },
            ],
          },
          {
            key: "project-hail-mary",
            title: "Project Hail Mary",
            overview:
              "This artwork was originally created for Ballantine Book's PROJECT HAIL MARY Rocky Fan Art Contest. To my amaze(ment), I was chosen as one of the finalists! Later, as I began developing my book design portfolio, I decided to turn this illustration into a dust jacket. While the original audience for Project Hail Mary is adults, my illustration's bright colors, character-focused composition, and hopeful mood lends itself to a younger audience.",
            genre: "Science Fiction",
            audience: "Middle Grade",
            tools: "Procreate, Photoshop",
            sections: [
              {
                title: "Contest",
                text: "For my illustration, I wanted to capture the hope and friendship at the heart of this story.",
                instagramEmbedTemplate: "project-hail-mary-instagram-embed",
                images: [
                  {
                    src: "assets/process/project-hail-mary/Rocky_And_Ryland.jpg",
                    alt: "Project Hail Mary illustration",
                    caption: "Original illustration",
                  },
                ],
              },
              {
                title: "Cover Design",
                text: "With my illustration already completed, designing the jacket was a matter of choosing fonts that reflected the science fiction genre and my illustration's lighter tone.",
                images: [
                  {
                    src: "assets/books/Project-Hail-Mary---Jacket-Design.jpg",
                    alt: "Project Hail Mary dust jacket design",
                    caption:
                      "",
                  },
                ],
              },
            ],
          },
          {
            key: "moon-of-the-turning-leaves",
            title: "Moon of the Turning Leaves",
            overview:
              "Use this page to show the decisions, experiments, and refinements behind a finished design.",
            genre: "Indigenous Dystopian Fiction",
            audience: "Adults",
            tools: "Photoshop",
            sections: [
              {
                title: "Starting point",
                text: "Describe the brief, the story, or the question that guided your first ideas. What did you want the audience to feel or notice?",
                images: [
                  {
                    src: "assets/books/Project-Hail-Mary.jpg",
                    alt: "Project Hail Mary initial cover concept",
                    caption:
                      "Replace this image with an early concept or reference board.",
                  },
                ],
              },
              {
                title: "Exploration",
                text: "Talk through the directions you tested and why. This is a good place to explain rejected ideas, visual references, color studies, typography tests, or composition sketches.",
                images: [
                  {
                    src: "assets/books/Project-Hail-Mary---Jacket-Design.jpg",
                    alt: "Project Hail Mary jacket design exploration",
                    caption:
                      "Replace this image with sketches, studies, or alternate directions.",
                  },
                  {
                    src: "assets/books/Katabasis.jpg",
                    alt: "Example visual exploration image",
                    caption: "Add another process image here when needed.",
                  },
                ],
              },
              {
                title: "Final decisions",
                text: "Explain what changed between the early work and the final piece. Share the details that made the design feel resolved and how the final choices served the story or brief.",
                images: [
                  {
                    src: "assets/books/Project-Hail-Mary---Jacket-Design.jpg",
                    alt: "Project Hail Mary final jacket design",
                    caption:
                      "Replace this image with the final design or a detail view.",
                  },
                ],
              },
            ],
          },
          {
            key: "lockwood-and-co",
            title: "Lockwood & Co",
            overview:
              "Lockwood & Co is a ghost-hunting, action-adventure book series for middle-grade to teenage audiences. For my cover design, I decided to draw the main trio brandishing their iconic rapiers standing surrounded by shadows and ghost fog. My goal was to capture the series’ mysterious, creepy tone while also showcasing the character’s personalities.",
            genre: "Supernatural, Mystery, Action-adventure",
            audience: "Middle Grade",
            tools: "Procreate",
            sections: [
              {
                title: "Research",
                text: "I began by researching popular titles in the middle grade and fantasy genres, taking note of their high contrast colors, character-centric compositions, and illustrative styles.",
                images: [
                  {
                    src: "assets/process/lockwood-and-co/Research.jpg",
                    alt: "Notes and research",
                    caption: "",
                  },
                ],
              },
              {
                title: "Exploration",
                text: "Next, I began the ideation process, taking what I learned and incorporating that into my thumbnails and color studies.",
                images: [
                  {
                    src: "assets/process/lockwood-and-co/Thumbnails.jpg",
                    alt: "Brainstorming and thumbnails",
                    caption: "Brainstorming and thumbnails",
                  },
                  {
                    src: "assets/process/lockwood-and-co/Color.jpg",
                    alt: "Color studies",
                    caption: "Color studies",
                  },
                ],
              },
              {
                title: "Creating",
                text: "Then, I began the final illustration. Using my thumbnail as a guide, I created a rough sketch, then finalized my line art, values, and color.",
                images: [
                  {
                    src: "assets/process/lockwood-and-co/Sketch 2.jpg",
                    alt: "Sketch 1",
                    caption: "Sketch 1",
                  },
                  {
                    src: "assets/process/lockwood-and-co/Sketch 1.jpg",
                    alt: "Sketch 2",
                    caption: "Sketch 2",
                  },
                ],
              },
              {
                title: "Final Product",
                text: "This design went through several changes. I originally chose my sketch 1 (with the skull and ghost fog at the bottom), but I decided it cluttered the composition and distracted from the characters. Sketch 2 (with the shadowy hands) does a better job of framing the characters without competing for the viewer's attention.",
                images: [
                  {
                    src: "assets/books/Lockwood-and-Co.jpg",
                    alt: "Final cover design",
                    caption: "",
                  },
                ],
              },
            ],
          },
        ];

        const processKey =
          new URLSearchParams(window.location.search).get("process") ||
          processProjects[0].key;
        const processProject =
          processProjects.find((item) => item.key === processKey) ||
          processProjects[0];

        document.getElementById("process-title").textContent =
          processProject.title;
        document.getElementById("process-overview").textContent =
          processProject.overview;
        document.getElementById("process-genre").textContent =
          processProject.genre;
        document.getElementById("process-audience").textContent =
          processProject.audience;
        document.getElementById("process-tools").textContent =
          processProject.tools;

        const processSections = document.getElementById("process-sections");

        processProject.sections.forEach((section, index) => {
          const sectionElement = document.createElement("section");
          sectionElement.className = "process-section";

          const heading = document.createElement("div");
          heading.className = "process-section-heading";

          const number = document.createElement("span");
          number.className = "process-section-number";
          number.textContent = String(index + 1).padStart(2, "0");

          const title = document.createElement("h2");
          title.textContent = section.title;
          heading.append(number, title);

          const content = document.createElement("div");
          content.className = "process-section-content";

          const text = document.createElement("p");
          text.textContent = section.text;

          const embedTemplate = section.instagramEmbedTemplate
            ? document.getElementById(section.instagramEmbedTemplate)
            : null;
          const instagramEmbed = embedTemplate
            ? embedTemplate.content.cloneNode(true)
            : null;

          const imageGrid = document.createElement("div");
          imageGrid.className = "process-image-grid";

          section.images.forEach((imageData) => {
            const figure = document.createElement("figure");
            figure.className = "project-image process-image";

            const image = document.createElement("img");
            image.src = imageData.src;
            image.alt = imageData.alt;
            image.dataset.caption = imageData.caption || "";

            const caption = document.createElement("figcaption");
            caption.className = "process-image-caption";
            caption.textContent = imageData.caption || "";

            figure.append(image, caption);
            imageGrid.appendChild(figure);
          });

          content.append(text);
          if (instagramEmbed) {
            const mediaPair = document.createElement("div");
            mediaPair.className = "process-media-pair";
            mediaPair.append(instagramEmbed, imageGrid);
            content.append(mediaPair);
          } else {
            content.append(imageGrid);
          }
          sectionElement.append(heading, content);
          processSections.appendChild(sectionElement);
        });

        if (processSections.querySelector(".instagram-media")) {
          const instagramScript = document.createElement("script");
          instagramScript.async = true;
          instagramScript.src = "https://www.instagram.com/embed.js";
          instagramScript.onload = () => window.instgrm?.Embeds?.process();
          document.body.appendChild(instagramScript);
        }

        const backButton = document.getElementById("back-to-portfolio-button");

        if (backButton) {
          backButton.addEventListener("click", (event) => {
            event.preventDefault();
            sessionStorage.setItem("scrollToWork", "true");
            window.location.href = "index.html";
          });
        }
      });
    </script>
